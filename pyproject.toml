[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nesy-firewall"
version = "1.0.0"
description = "Experimental neuro-symbolic firewall verification pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["z3-solver>=4.12"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
nesy-firewall = "nesy_firewall.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
